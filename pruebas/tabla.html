<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Productos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 40px;
    }

    .contenedor-tabla {
      background: white;
      padding: 20px;
      border-radius: 6px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      max-width: 800px;
      margin: auto;
    }

    .encabezado-tabla {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .encabezado-tabla h2 {
      font-size: 22px;
      font-weight: bold;
    }

    .encabezado-tabla a {
      color: #6a0dad;
      font-weight: bold;
      text-decoration: none;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      background-color: #f5f5f5;
    }

    th {
      text-align: left;
      padding: 12px;
      font-weight: bold;
    }

    td {
      padding: 15px 12px;
      vertical-align: middle;
    }

    .producto-info {
      display: flex;
      align-items: center;
    }

    .producto-img {
      width: 40px;
      height: 40px;
      background-color: #ccc;
      border-radius: 8px;
      margin-right: 10px;
    }

    .nombre-producto {
      font-weight: bold;
    }

    .detalle-producto {
      font-size: 12px;
      color: #999;
    }

    .precio {
      color: #6a0dad;
      font-weight: bold;
    }

    .disponible {
      color: green;
      font-weight: bold;
    }

    .agotado {
      color: red;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="contenedor-tabla">
  <div class="encabezado-tabla">
    <h2>Productos</h2>
    <a href="#">Ver todos</a>
  </div>

  <table>
    <thead>
      <tr>
        <th>Productos</th>
        <th>Categoría</th>
        <th>Precio</th>
        <th>Estado</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>
          <div class="producto-info">
            <div class="producto-img"></div>
            <div>
              <div class="nombre-producto">Coca cola 1L</div>
              <div class="detalle-producto">1L</div>
            </div>
          </div>
        </td>
        <td>Bebidas</td>
        <td class="precio">$7.500</td>
        <td class="disponible">Disponible</td>
      </tr>
      <tr>
        <td>
          <div class="producto-info">
            <div class="producto-img"></div>
            <div>
              <div class="nombre-producto">Arroz Diana</div>
              <div class="detalle-producto">200g</div>
            </div>
          </div>
        </td>
        <td>Granos</td>
        <td class="precio">$3.500</td>
        <td class="agotado">Agotado</td>
      </tr>
    </tbody>
  </table>
</div>

</body>
</html>
